# Maximum-strictness configuration: every cop runs in "fail the build" mode, there is no todo
# file, and inline RuboCop directives are forbidden (Style/DisableCopsWithinSourceCodeDirective,
# script/forbidden_suppressions.sh). A cop that cannot apply to a file is configured narrowly
# below, with the reason next to it.
AllCops:
  # The gem supports Ruby >= 2.7 (gemspec), so the code must stay valid 2.7 syntax.
  TargetRubyVersion: 2.7
  NewCops: enable
  SuggestExtensions: false
  # Setting Exclude replaces RuboCop's defaults, so they are restated here. The generated gem
  # RBIs (`bin/tapioca gem`) are machine-written and never hand-edited, hence not linted.
  Exclude:
    - ".claude/**/*"
    - ".git/**/*"
    - "coverage/**/*"
    - "doc/**/*"
    - "node_modules/**/*"
    - "sorbet/rbi/gems/**/*"
    - "tmp/**/*"
    - "vendor/**/*"

# The `plugins:` key requires rubocop >= 1.72, which the gemspec's rubocop floor matches.
plugins:
  - rubocop-md
  - rubocop-packaging
  - rubocop-performance
  - rubocop-rake
  - rubocop-rspec
  - rubocop-thread_safety
  - rubocop-sorbet

Style/FrozenStringLiteralComment:
  Enabled: true
  EnforcedStyle: always

# Justification: the gem's conventional entry point is the hyphenated `simplecov-ai.rb`,
# which does not match the module path the cop expects.
Naming/FileName:
  Exclude:
    - "lib/simplecov-ai.rb"
    # rubocop-md lints the Ruby snippets of the Markdown files; their names (README.md,
    # CHANGELOG.md, ...) are conventional, not Ruby source file names.
    - "**/*.md"

# Justification: RSpec example groups and the gemspec declaration are naturally long blocks.
Metrics/BlockLength:
  Enabled: true
  Exclude:
    - "spec/**/*"
    - "simplecov-ai.gemspec"
Metrics/ModuleLength:
  Enabled: true
Metrics/ClassLength:
  Enabled: true
RSpec/ExampleLength:
  Enabled: true
  Max: 10

Gemspec/DevelopmentDependencies:
  Enabled: false

RSpec/MultipleMemoizedHelpers:
  Enabled: true
  Max: 7

RSpec/NestedGroups:
  Enabled: true
  Max: 4
RSpec/MultipleExpectations:
  Enabled: true

Metrics/AbcSize:
  Enabled: true
Metrics/MethodLength:
  Enabled: true
Metrics/CyclomaticComplexity:
  Enabled: true
Metrics/PerceivedComplexity:
  Enabled: true

Gemspec/RequiredRubyVersion:
  Enabled: true
Style/Documentation:
  Enabled: true
Lint/MissingCopEnableDirective:
  Enabled: true
Style/ClassVars:
  Enabled: true
Style/ClassMethods:
  Enabled: true
RSpec/SpecFilePathFormat:
  Enabled: true
RSpec/SpecFilePathSuffix:
  Enabled: true
RSpec/DescribedClass:
  Enabled: true
RSpec/DescribeClass:
  Enabled: true
# Justification: the memoized `@configuration` on the formatter class is intentionally a
# process-global singleton, mutated only during single-threaded setup before coverage runs.
ThreadSafety/ClassInstanceVariable:
  Enabled: true
  Exclude:
    - "lib/simplecov-ai.rb"
Style/MultilineBlockChain:
  Enabled: true

# Justification: a `sig` on `attr_accessor` is enforced by sorbet-runtime for the reader only, so
# the Configuration booleans keep a separate `attr_reader` and a `sig`-typed `attr_writer`; that
# writer signature is what rejects a mis-typed value (`output_to_console = "yes"`) at assignment.
Style/BisectedAttrAccessor:
  Enabled: false
Layout/LineLength:
  Enabled: true

Sorbet/ForbidTUntyped:
  Enabled: true

Sorbet/ForbidTUnsafe:
  Enabled: true

# Justification: specs are `typed: false` and exercise the library through RSpec verifying
# doubles, so requiring Sorbet signatures on test helpers adds noise without type safety.
Sorbet/EnforceSignatures:
  Enabled: true
  Exclude:
    - "spec/**/*"

Sorbet/SignatureBuildOrder:
  Enabled: false

Sorbet/KeywordArgumentOrdering:
  Enabled: false

Sorbet/ForbidRBIOutsideOfAllowedPaths:
  Enabled: true
  Include:
    - "**/*.rbi"
  AllowedPaths:
    - "sorbet/rbi/**/*.rbi"

Sorbet/ForbidExtendTSigHelpersInShims:
  Enabled: true
  Include:
    - "**/*.rbi"

Sorbet/StrictSigil:
  Enabled: true
  Exclude:
    - "bin/tapioca"
    - "sorbet/tapioca/require.rb"
    - "spec/**/*"

Sorbet/HasSigil:
  Enabled: true
  Exclude:
    - "bin/tapioca"

Sorbet/FalseSigil:
  Enabled: true
  Exclude:
    - "bin/tapioca"

Style/DisableCopsWithinSourceCodeDirective:
  Enabled: true

# Justification: fixtures deliberately use unconventional control flow to create the exact
# branch/coverage shapes under test; linting them would destroy the scenarios.
Style/UnlessElse:
  Exclude:
    - "spec/fixtures/**/*"

Lint/UnreachableLoop:
  Exclude:
    - "spec/fixtures/**/*"

# Justification: the resolver fixture reproduces the exact `CONST ||= value` shape that used to
# crash AST resolution; the cop's rewrite would remove the construct under test.
Lint/OrAssignmentToConstant:
  Exclude:
    - "spec/fixtures/**/*"

# Justification: single-letter identifiers are forbidden by SCAI-REQ-021, so rescued exceptions
# are named `error` rather than RuboCop's default `e`.
Naming/RescuedExceptionsVariableName:
  PreferredName: error

# --- Optional (disabled-by-default) cops that make sense for this codebase ---
# Not enabled: Style/StringHashKeys (SimpleCov's coverage data is keyed by Strings by contract),
# Style/RequireOrder (lib/ requires its files in dependency order, which load-time constants
# rely on) and Style/ConstantVisibility (every constant is part of the documented API).
Layout/ClassStructure:
  Enabled: true
Layout/EmptyLineAfterMultilineCondition:
  Enabled: true
Lint/NumberConversion:
  Enabled: true
Lint/RedundantCopDisableDirective:
  Enabled: true
Naming/InclusiveLanguage:
  Enabled: true
# Library code only: the specs build expectations and fixtures, where an extra intermediate
# Array costs nothing and an in-place `map!` would only obscure the expected value.
Performance/ChainArrayAllocation:
  Enabled: true
  Include:
    - "lib/**/*.rb"
Style/InvertibleUnlessCondition:
  Enabled: true
Style/MethodCalledOnDoEndBlock:
  Enabled: true
Style/Send:
  Enabled: true
Style/SingleLineBlockParams:
  Enabled: true

# --- Sorbet: no escape hatches in the library ---
Sorbet/ForbidTCast:
  Enabled: true
  Include:
    - "lib/**/*.rb"
Sorbet/ForbidTBind:
  Enabled: true
Sorbet/ForbidTMust:
  Enabled: true
  Include:
    - "lib/**/*.rb"

# Sorbet does not check the specs (sorbet/config ignores spec/), and a `def` inside an example
# group is how RSpec scopes a helper method to that group.
Sorbet/BlockMethodDefinition:
  Exclude:
    - "spec/**/*"
