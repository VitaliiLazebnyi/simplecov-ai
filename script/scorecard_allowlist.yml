---
# Dependencies whose OpenSSF Scorecard (https://scorecard.dev) is below the threshold of
# script/scorecard.rb but which this project cannot drop or replace. Each entry names the score it
# was reviewed at and why the dependency stays. `rake scorecard` fails for any other low-scoring
# dependency, for an entry whose dependency now scores at or above the threshold, and for an entry
# the dependencies no longer contain.
actions: {}
gems:
  flog:
    reason: >-
      The method-complexity gate (`rake flog`). It is the only tool that scores the complexity of
      each Ruby method as a whole (RuboCop's Metrics cops count one dimension each), and it comes
      from the same maintainers as Flay (seattlerb). It is a development-only dependency and does
      not ship with the gem.
    reviewed_on: 2026-11-08
    reviewed_score: 1.5
  ruby-progressbar:
    reason: >-
      A hard runtime dependency of RuboCop (rubocop 1.92: ruby-progressbar ~> 1.7), which renders
      RuboCop's progress output. The lint gate cannot be installed without it, and it does not ship
      with the gem.
    reviewed_on: 2026-11-08
    reviewed_score: 2.8
pip: {}
