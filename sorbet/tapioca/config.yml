gem:
  # `rake typecheck` runs `srb tc --typed strong`, which raises every `# typed: true` file to
  # strong and would then demand a `sig` on each reflected gem method. Generated gem RBIs are
  # therefore emitted with the `autogenerated` sigil (the level Sorbet uses for machine-written
  # RBIs), which `--typed` does not override; typed overlays for the gem methods `lib/` calls
  # live in sorbet/rbi/parser.rbi, sorbet/rbi/prism.rbi and sorbet/rbi/simplecov.rbi.
  typed_overrides:
    ast: autogenerated
    parser: autogenerated
    prism: autogenerated
    racc: autogenerated
    simplecov: autogenerated
dsl:
  # The gem defines no DSL-generated code; `tapioca dsl` is intentionally unused.
  exclude: []
