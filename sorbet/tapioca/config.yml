gem:
  # The quality gate runs `srb tc --typed strong`, which raises every `# typed: true` file to
  # strong and would then demand a `sig` on each reflected gem method. Generated gem RBIs are
  # therefore emitted with the `autogenerated` sigil (the level Sorbet uses for machine-written
  # RBIs), which `--typed` does not override; typed overlays for the few methods `lib/` calls
  # live in sorbet/rbi/parser.rbi and sorbet/rbi/simplecov.rbi.
  typed_overrides:
    ast: autogenerated
    parser: autogenerated
    prism: autogenerated
    racc: autogenerated
    simplecov: autogenerated
  # Only gems that `lib/` calls into need RBIs: the runtime dependencies (parser/ast/racc,
  # simplecov) and prism, whose `Prism::Translation::Parser` is the parser-gem-compatible
  # front end for Ruby 3.4+ grammar. Every development-only gem is excluded so the checked-in
  # `sorbet/rbi/gems/` directory stays small; add new development-only gems here when they are
  # introduced, then run `bin/tapioca gem` (or `rake rbi`) to refresh the RBIs.
  exclude:
    - base64
    - benchmark
    - bigdecimal
    - bundler-audit
    - concurrent-ruby
    - debride
    - diff-lcs
    - dry-configurable
    - dry-core
    - dry-inflector
    - dry-initializer
    - dry-logic
    - dry-schema
    - dry-types
    - erubi
    - flay
    - flog
    - json
    - language_server-protocol
    - lint_roller
    - logger
    - netrc
    - ostruct
    - parallel
    - path_expander
    - rainbow
    - rake
    - rbi
    - rbs
    - reek
    - regexp_parser
    - require-hooks
    - rexml
    - rspec
    - rspec-core
    - rspec-expectations
    - rspec-mocks
    - rspec-support
    - rubocop
    - rubocop-ast
    - rubocop-packaging
    - rubocop-performance
    - rubocop-rspec
    - rubocop-sorbet
    - rubocop-thread_safety
    - ruby-progressbar
    - rubydex
    - sexp_processor
    - spoom
    - standard-sorbet
    - tapioca
    - thor
    - tsort
    - unicode-display_width
    - unicode-emoji
    - yard
    - yard-sorbet
    - zeitwerk
dsl:
  # The gem defines no DSL-generated code; `bin/tapioca dsl` is intentionally unused.
  exclude: []
