name: Automated Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build_and_release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: "4.0"
        bundler-cache: true

    - name: Extract Release Version
      run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_ENV"

    - name: Verify committed version matches the tag
      env:
        VERSION: ${{ env.VERSION }}
      run: |
        file_version=$(sed -n "s/.*VERSION = T.let('\\([^']*\\)'.*/\\1/p" lib/simplecov-ai/version.rb)
        if [ "$file_version" != "$VERSION" ]; then
          echo "::error::lib/simplecov-ai/version.rb ($file_version) does not match the release tag ($VERSION)."
          exit 1
        fi

    # Quality gates must pass before anything is built or published.
    - name: Run RuboCop
      run: bundle exec rubocop

    - name: Run Sorbet Typechecker
      run: bundle exec srb tc --typed strong

    - name: Verify Documentation Generation
      run: bundle exec yardoc --fail-on-warning

    - name: Run Tests
      run: bundle exec rspec

    - name: Recover Private Key for Code Signing
      env:
        GEM_PRIVATE_KEY: ${{ secrets.GEM_PRIVATE_KEY }}
      run: |
        if [ -n "$GEM_PRIVATE_KEY" ]; then
          mkdir -p ~/.gem
          printf '%s\n' "$GEM_PRIVATE_KEY" > ~/.gem/gem-private_key.pem
          chmod 0600 ~/.gem/gem-private_key.pem
        else
          echo "No GEM_PRIVATE_KEY secret found, skipping signature recovery."
        fi

    - name: Build Gem
      run: gem build simplecov-ai.gemspec

    - name: Configure RubyGems Credentials (OIDC)
      uses: rubygems/configure-rubygems-credentials@v1

    # Publish to RubyGems first so a failed push does not leave an orphaned GitHub Release.
    - name: Publish to RubyGems
      env:
        VERSION: ${{ env.VERSION }}
      run: gem push "simplecov-ai-${VERSION}.gem"

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v3
      with:
        files: simplecov-ai-${{ env.VERSION }}.gem
