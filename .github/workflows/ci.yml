name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Nothing is writable by default; every job re-declares the (read-only) permissions it needs.
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUBYOPT: -W:deprecated

# The single-version gates run on the Ruby of .ruby-version against the committed Gemfile.lock.
# The test matrix deletes the lockfile first: it was resolved on that Ruby, and older Rubies
# (and the other engines) cannot install that set, so each one resolves its own test bundle
# exactly like a user's bundle (the Gemfile limits the development tooling to MRI >= 3.3).
jobs:
  lint:
    name: RuboCop and inline suppressions
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
      with:
        ruby-version: .ruby-version
        bundler-cache: true
    - name: Check the Ruby version
      run: script/check_ruby.sh
    - run: bundle exec rake rubocop suppressions

  typecheck:
    name: "Sorbet (lib/ typed: strong)"
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
      with:
        ruby-version: .ruby-version
        bundler-cache: true
    - name: Check the Ruby version
      run: script/check_ruby.sh
    - run: bundle exec rake typecheck

  docs:
    name: YARD (no warnings, 100% documented)
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
      with:
        ruby-version: .ruby-version
        bundler-cache: true
    - name: Check the Ruby version
      run: script/check_ruby.sh
    - run: bundle exec rake yard

  smells:
    name: Reek, Flay, Flog, Debride
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
      with:
        ruby-version: .ruby-version
        bundler-cache: true
    - name: Check the Ruby version
      run: script/check_ruby.sh
    - run: bundle exec rake reek flay flog debride

  build:
    name: Gem build and install smoke test
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
      with:
        ruby-version: .ruby-version
        bundler-cache: true
    - name: Check the Ruby version
      run: script/check_ruby.sh
    - run: bundle exec rake build

  # Every gem, Ruby, Action and tool at its newest release, except the documented holds
  # (script/outdated_holds.yml), which name the upstream constraint that blocks each one.
  outdated:
    name: Outdated dependencies
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
      with:
        ruby-version: .ruby-version
        bundler-cache: true
    - name: Check the Ruby version
      run: script/check_ruby.sh
    - run: bundle exec rake outdated

  # RUBYOPT=-w on every suite run, and only there (RubyGems and Bundler trip Ruby's verbose-mode
  # diagnostics while they install): spec/support/warnings.rb fails the suite on any warning that
  # reaches STDERR. On MRI with the lockfile Ruby SimpleCov enforces 100% line, branch and method
  # coverage (spec/spec_helper.rb).
  test:
    name: RSpec (Ruby ${{ matrix.ruby }})
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.2.11", "3.3.13", "3.4.12", "4.0.9"]
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Resolve the test bundle for this Ruby (see the note at the top of this file)
      run: rm -f Gemfile.lock
    - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
      with:
        ruby-version: ${{ matrix.ruby }}
        bundler-cache: true
    - name: Check the Ruby version
      env:
        EXPECTED_RUBY: ${{ matrix.ruby }}
      run: script/check_ruby.sh "$EXPECTED_RUBY"
    - run: bundle exec rspec
      env:
        RUBYOPT: -w -W:deprecated

  # The supported floor, Ruby 2.7, runs in its official image: ruby/setup-ruby has no Ruby 2.7
  # build for ubuntu-26.04 (2.7 reached its end of life before that image existed). It runs the
  # default bundle and the oldest supported SimpleCov.
  test-ruby27:
    name: RSpec (Ruby 2.7.8, ${{ matrix.gemfile }})
    runs-on: ubuntu-26.04
    container:
      image: ruby:2.7.8-bullseye@sha256:2347de892e419c7160fc21dec721d5952736909f8c3fbb7f84cb4a07aaf9ce7d
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        gemfile: [Gemfile, gemfiles/simplecov_0.18.gemfile]
    env:
      BUNDLE_GEMFILE: ${{ matrix.gemfile }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Resolve the test bundle for this Ruby (see the note at the top of this file)
      run: rm -f Gemfile.lock
    - name: Check the Ruby version
      run: script/check_ruby.sh "2.7.8"
    - run: bundle install --jobs 4
    - run: bundle exec rspec
      env:
        RUBYOPT: -w -W:deprecated

  # The lockfile Ruby once more, against the committed Gemfile.lock: the exact bundle the other
  # gates use.
  test-lockfile:
    name: RSpec (Gemfile.lock)
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
      with:
        ruby-version: .ruby-version
        bundler-cache: true
    - name: Check the Ruby version
      run: script/check_ruby.sh
    - run: bundle exec rake spec
      env:
        RUBYOPT: -w -W:deprecated

  # sorbet-static has no Windows build, so the Windows bundle is the test bundle only. What sets
  # Windows apart (text-mode writes turning "\n" into "\r\n") is also exercised everywhere by
  # the suite's CRLF examples.
  test-windows:
    name: RSpec (Windows, Ruby 4.0.9)
    runs-on: windows-2025
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Resolve the test bundle for this platform (see the note at the top of this file)
      run: rm -f Gemfile.lock
      shell: bash
    - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
      with:
        ruby-version: "4.0.9"
        bundler-cache: true
    - name: Check the Ruby version
      run: script/check_ruby.sh 4.0.9
      shell: bash
    - run: bundle exec rspec
      env:
        RUBYOPT: -w -W:deprecated
      shell: bash

  # JRuby and TruffleRuby record no branch or method coverage: the suite drives the formatter's
  # branch and method rendering with hand-built SimpleCov data there (spec/spec_helper.rb), and
  # the 100% coverage mandate is MRI's gate (both engines attribute some executed lines
  # differently). Reproduce locally with `rake check:jruby` and `rake check:truffleruby`.
  test-engines:
    name: RSpec (${{ matrix.ruby }})
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        ruby: [jruby-10.1.2.0, truffleruby-40.0.0]
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Resolve the test bundle for this engine (see the note at the top of this file)
      run: rm -f Gemfile.lock
    - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
      with:
        ruby-version: ${{ matrix.ruby }}
        bundler-cache: true
    - run: bundle exec rspec
      env:
        RUBYOPT: -w

  # Every SimpleCov release line inside the gemspec's `>= 0.18, < 2.0` range, each from its own
  # gemfile (gemfiles/simplecov_<line>.gemfile); test-ruby27 additionally covers the floor.
  simplecov-compat:
    name: RSpec (SimpleCov ${{ matrix.simplecov }}, Ruby ${{ matrix.ruby }})
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.4.12"]
        simplecov: ["0.18", "0.21", "0.22", "1.0", "1.1", "1.2", "1.3"]
    env:
      BUNDLE_GEMFILE: gemfiles/simplecov_${{ matrix.simplecov }}.gemfile
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
      with:
        ruby-version: ${{ matrix.ruby }}
        bundler-cache: true
    - name: Check the Ruby version
      env:
        EXPECTED_RUBY: ${{ matrix.ruby }}
      run: script/check_ruby.sh "$EXPECTED_RUBY"
    - run: bundle exec rspec
      env:
        RUBYOPT: -w -W:deprecated

  markdownlint:
    name: markdownlint
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - run: npx --yes markdownlint-cli2@0.24.0 "**/*.md"

  typos:
    name: typos
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - uses: crate-ci/typos@7f9d0819ca1c008ade73f4b41fa9d258d48f605b # v1.51.1

  warning-gate:
    name: Warning gate
    if: ${{ !cancelled() }}
    needs: [lint, typecheck, docs, smells, build, outdated, test, test-ruby27, test-lockfile, test-windows, test-engines, simplecov-compat, markdownlint, typos]
    runs-on: ubuntu-26.04
    permissions:
      actions: read # reads the logs of the other jobs of this run
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Fail on any warning or deprecation in the logs of this run
      env:
        GH_TOKEN: ${{ github.token }}
        GATE_JOB_NAME: Warning gate
      run: script/warning_gate.sh
