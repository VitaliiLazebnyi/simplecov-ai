---
name: Workflow lint

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Nothing is writable by default; every job re-declares the (read-only) permissions it needs.
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # actionlint runs ShellCheck, with every optional check (.shellcheckrc), on every `run:` script.
  actionlint:
    name: actionlint
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a  # v2.22.4
        with:
          egress-policy: block
          disable-sudo-and-containers: true
          allowed-endpoints: >-
            github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # The archives are verified against their published SHA-256 before they are run.
      - name: Install actionlint and ShellCheck
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          SHELLCHECK_VERSION: 0.11.0
          SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location --output "${RUNNER_TEMP}/${archive}" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum --check --strict
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}" actionlint
          archive="shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          curl --fail --silent --show-error --location --output "${RUNNER_TEMP}/${archive}" \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/${archive}"
          echo "${SHELLCHECK_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum --check --strict
          tar -xJf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}" --strip-components 1 \
            "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"
      - run: >-
          "${RUNNER_TEMP}/actionlint" -color -shellcheck "${RUNNER_TEMP}/shellcheck"

  zizmor:
    name: zizmor (pedantic)
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a  # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >-
            api.github.com:443
            ghcr.io:443
            github.com:443
            pkg-containers.githubusercontent.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd  # v0.8.1
        with:
          advanced-security: false
          persona: pedantic

  warning-gate:
    name: Warning gate
    if: ${{ !cancelled() }}
    needs: [actionlint, zizmor]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      actions: read  # reads the logs of the other jobs of this run
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a  # v2.22.4
        with:
          egress-policy: block
          disable-sudo-and-containers: true
          allowed-endpoints: >-
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            api.github.com:443
            github.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Fail on any warning or deprecation in the logs of this run
        env:
          GH_TOKEN: ${{ github.token }}
          GATE_JOB_NAME: Warning gate
        run: script/warning_gate.sh
