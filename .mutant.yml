# Mutation testing with mutant (`bundle exec rake mutant`, or `bundle exec mutant run` directly;
# `bundle exec mutant run 'SimpleCov::Formatter::AIFormatter::LineSpan*'` runs one scope while
# iterating). Every constant and method under the gem's namespace is a subject, there are no
# ignore patterns, and every mutation must be killed: a mutation no example fails on fails the run.
usage: opensource
integration:
  name: rspec
includes:
  - lib
requires:
  - simplecov-ai
environment_variables:
  # spec/spec_helper.rb neither starts SimpleCov nor enforces the coverage minimums when set:
  # the specs run once per mutation in forked workers, where measuring coverage is meaningless
  # and slow, and warnings-as-errors is left to the ordinary suite so a kill always means a
  # failing example.
  MUTANT: '1'
matcher:
  subjects:
    - SimpleCov::Formatter::AIFormatter*
coverage_criteria:
  # A mutation that crashes the forked worker (e.g. by raising past RSpec) counts as killed.
  process_abort: true
