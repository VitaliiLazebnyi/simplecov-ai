# reek runs with its default configuration (`rake reek`, CI) over lib/. One detector is
# narrowed, for one class:
detectors:
  TooManyConstants:
    exclude:
      # The eight constants of Configuration (its documented defaults and VALID_GRANULARITIES)
      # are public API: callers read them, so none can be removed, renamed or regrouped.
      - SimpleCov::Formatter::AIFormatter::Configuration
